<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RobSims · Brazo Robótico 3D Isométrico</title>
    <link rel="stylesheet" href="src/style.css" />

    <!--
      Sin build step: three.js, sus addons y lil-gui están vendorizados en
      vendor/ y se resuelven vía import map, tal cual los sirve un navegador
      moderno. Esto es HTML/JS estático puro — abre esta carpeta con
      cualquier servidor estático (o GitHub Pages "Deploy from a branch")
      y funciona sin compilar nada.
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/examples/jsm/",
          "lil-gui": "./vendor/lil-gui/lil-gui.esm.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="app">
      <canvas id="scene-canvas"></canvas>

      <div id="loading-screen">
        <div class="loading-inner">
          <div class="spinner"></div>
          <p id="loading-text">Cargando modelo 3D…</p>
        </div>
      </div>

      <header id="hud-top">
        <div class="hud-panel">
          <h1>RobSims</h1>
          <p>Brazo robótico · vista isométrica · PBR + IBL</p>
          <label id="file-import-label" for="model-file-input">+ Agregar modelo (.fbx)</label>
          <input type="file" id="model-file-input" accept=".fbx" />
        </div>
      </header>

      <footer id="hud-bottom">
        <div class="hud-panel">
          <span>Clic: seleccionar · Arrastra: orbitar · Scroll: zoom</span>
          <span>G/R/S: mover / rotar / escalar · Supr: eliminar</span>
        </div>
      </footer>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
